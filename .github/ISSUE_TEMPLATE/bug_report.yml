name: Bug report
description: Something in the contracts, tests, scripts or documentation does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here: use [private vulnerability reporting](https://github.com/global-reserve/gret-contracts/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, a failing test or a transaction hash.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit you used.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system and network (local, fork or mainnet).
